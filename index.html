<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>AI 안경 감독관</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;800&family=Gaegu:wght@700&family=Nanum+Myeongjo:wght@400;800&display=swap">
<style>
/* 감독관의 서류철: 교실은 캔버스, 그 위에 뜨는 모든 카드는 실제 수능 서류(지침서, 문제지 표지, 채점표, 판결문, 수험표)처럼 */
:root{
  --hall:#14201B;
  --board:#2d4636;
  --chalk:#EEF2EC;
  --paper:#FCFCF8;
  --ink:#1C1F24;
  --ink-2:#4A5058;
  --omr:#D9435E;
  --omr-line:#EFC7CF;
  --stamp:#D9435E;
  --ai:#33D1C6;
  --muted:#8FA39A;
  --f-ui:"Pretendard Variable",Pretendard,-apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;
  --f-exam:"Hahmlet","Nanum Myeongjo",serif;
  --f-display:var(--f-ui);
  --f-body:var(--f-ui);
  --f-court:"Nanum Myeongjo","Batang",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:radial-gradient(120% 70% at 50% 0%,#1B2A23 0%,var(--hall) 60%);background-color:var(--hall);
  color:var(--chalk);font-family:var(--f-ui);font-feature-settings:"tnum" 0;
  -webkit-font-smoothing:antialiased;letter-spacing:-.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px;box-sizing:border-box;
}
button{font-family:inherit}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* HUD */
.hud{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:16px;background:rgba(238,242,236,.05);box-shadow:inset 0 0 0 1px rgba(238,242,236,.08)}
.hud-k{display:block;font-size:11px;font-weight:500;color:var(--muted);line-height:1.2;margin-bottom:2px}
.hud-period b{font-size:17px;font-weight:700;letter-spacing:-.02em}
.hud-timer{justify-self:center;display:flex;align-items:baseline;gap:8px;padding:6px 16px;border-radius:12px;background:rgba(0,0,0,.28)}
.hud-timer .time{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1;transition:color .2s}
.hud-timer .time.low{color:#FF7A8E}
.hud-right{justify-self:end;display:flex;align-items:center;gap:18px}
.hud-score b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.pips{display:flex;gap:5px;height:20px;align-items:center}
.pip{width:11px;height:17px;border-radius:50%;box-shadow:inset 0 0 0 1.5px rgba(238,242,236,.45);transition:background .2s,box-shadow .2s}
.pip.on{background:var(--chalk);box-shadow:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;background:transparent;color:var(--chalk);border:0;border-radius:12px;cursor:pointer}
.iconbtn:hover{background:rgba(238,242,236,.08)}
.iconbtn svg{width:20px;height:20px}
.iconbtn .off{display:none}
.iconbtn.muted .on{display:none}
.iconbtn.muted .off{display:block}
.iconbtn:focus-visible,.btn:focus-visible{outline:3px solid var(--ai);outline-offset:2px}

.stage{position:relative;width:100%;max-width:100%;aspect-ratio:1000/640;border-radius:18px;overflow:hidden;background:var(--board);box-shadow:0 0 0 1px rgba(238,242,236,.06),0 24px 60px -18px rgba(0,0,0,.7)}
.stage.shake{animation:shake .5s}
@keyframes shake{20%{transform:translate(-8px,2px)}40%{transform:translate(7px,-3px)}60%{transform:translate(-5px,1px)}80%{transform:translate(4px,0)}}
#hall{width:100%;height:100%;display:block;cursor:zoom-in;touch-action:manipulation}
.note{margin:0 4px;color:var(--muted);font-size:13px;line-height:1.6}
.toast{position:absolute;left:50%;top:16%;transform:translate(-50%,0) scale(.96);background:var(--omr);color:#fff;font-weight:700;font-size:16px;padding:10px 18px;border-radius:999px;box-shadow:0 10px 30px -6px rgba(217,67,94,.6);pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,-6px) scale(1)}

/* overlays + paper */
.overlay{position:fixed;inset:0;z-index:20;display:flex;overflow:auto;background:rgba(8,13,11,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.card{margin:auto;background:var(--paper);color:var(--ink);border-radius:20px;padding:28px;max-width:540px;width:100%;box-sizing:border-box;
  box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 40px 90px -24px rgba(0,0,0,.75);display:flex;flex-direction:column;gap:16px;animation:rise .24s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.98)}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1px solid var(--omr-line);font-size:12px;font-weight:600;color:var(--ink-2)}
.tag{font-size:12px;font-weight:700;color:var(--ink);padding:3px 8px;border:1.5px solid var(--ink);border-radius:4px;white-space:nowrap}
.card h1,.card h2{font-family:var(--f-exam);font-weight:800;margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.03em}
.card h1{font-size:44px}
.card h2{font-size:32px}
.card p{margin:0;line-height:1.7;font-size:15px;color:var(--ink-2)}
.card p b{color:var(--ink)}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.55;color:var(--ink-2)}
.rules li{position:relative;padding-left:18px}
.rules li::before{content:"";position:absolute;left:2px;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--omr)}
.rules b{color:var(--ink);font-weight:700}
.clues{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:500;background:#EEF0EE;color:var(--ink-2);border-radius:999px;padding:5px 11px}
.chip.ai{background:#DDF4F2;color:#0B6B65}
.chip.ai::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ai);margin-right:6px;vertical-align:1px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{font-weight:700;font-size:17px;letter-spacing:-.01em;min-height:52px;padding:0 26px;background:var(--ink);color:#fff;border:0;border-radius:14px;cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 6px -2px rgba(0,0,0,.4);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn.red{background:var(--omr);color:#fff}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,currentColor 28%,transparent)}
.card .row .btn{flex:1}
.btn:disabled{opacity:.55;cursor:default;transform:none}
.sign{align-self:flex-end;font-family:var(--f-exam);font-size:13px;color:#7A7F86}
.tip{background:#F4F5F2;border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.7;color:var(--ink-2)}
.tip b{color:var(--ink)}

/* 문제지 표지 */
.cover{display:flex;flex-direction:column;gap:14px}
.cover-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-exam);font-size:13px;font-weight:600;color:var(--ink-2)}
.cover-title{display:flex;align-items:center;gap:16px;padding:18px 0;border-top:3px solid var(--ink);border-bottom:1px solid var(--ink)}
.cover-no{flex:none;width:58px;height:58px;display:grid;place-items:center;border:2px solid var(--ink);border-radius:50%;font-family:var(--f-exam);font-weight:800;font-size:30px;line-height:1}
.cover-title .big{font-family:var(--f-exam);font-weight:800;font-size:48px;line-height:1;letter-spacing:.06em}
.cover-meta{display:grid;grid-template-columns:auto 1fr auto 1fr;font-size:13px;border:1px solid var(--omr-line);border-radius:8px;overflow:hidden}
.cover-meta span{padding:8px 10px}
.cover-meta .k{background:#FBEFF1;color:#9B3346;font-weight:600}
.cover-meta .v{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.big{font-family:var(--f-exam);font-weight:800;font-size:48px;line-height:1}

/* 채점표 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--omr-line);border-bottom:1px solid var(--omr-line)}
.stat{padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stat+.stat{border-left:1px solid var(--omr-line)}
.stat b{font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:var(--ink)}
.stat span{font-size:12px;color:var(--ink-2);order:2}

/* 확대 관찰 */
.zoomcard{margin:auto;background:#0F1613;color:var(--chalk);border-radius:22px;padding:16px;max-width:560px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 0 0 1px rgba(238,242,236,.08),0 40px 90px -24px rgba(0,0,0,.8);animation:rise .2s cubic-bezier(.2,.8,.2,1)}
.zoomcard .zh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:16px;font-weight:700;padding:2px 4px}
.zoomcard .zh .time{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;background:rgba(238,242,236,.08);padding:5px 10px;border-radius:999px}
#zoomcv{width:100%;max-width:100%;aspect-ratio:520/380;display:block;border-radius:14px;background:#cfc6b2}
.zoomcard .row .btn{flex:1;min-width:140px}
.zoomcard .hint{font-size:13px;color:var(--muted);margin:0 4px;line-height:1.5}

/* endings */
.jail{background:repeating-linear-gradient(90deg,rgba(6,8,10,.93) 0 54px,#454b52 54px 62px,#2b3036 62px 66px)}
.verdict{font-family:var(--f-court);background:#FBFAF6;gap:12px;position:relative;border-radius:6px}
.verdict .court{text-align:center;font-size:14px;letter-spacing:.3em}
.verdict h2{font-family:var(--f-court);font-weight:800;text-align:center;font-size:34px;letter-spacing:.6em;padding-left:.6em}
.verdict dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:14px}
.verdict dt{font-weight:800}
.verdict dd{margin:0}
.verdict h3{margin:4px 0 0;font-size:15px;font-weight:800;letter-spacing:.5em;text-align:center}
.verdict .sentence{font-size:20px;font-weight:800;text-align:center;line-height:1.6;color:var(--ink)}
.verdict p{font-family:var(--f-court);font-size:14px;line-height:1.9}
.seal{position:absolute;right:26px;bottom:96px;width:62px;height:62px;border:3px solid var(--stamp);color:var(--stamp);border-radius:6px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:14px;line-height:1.2;transform:rotate(-8deg);opacity:.85}
.ending-tag{font-size:13px;font-weight:700;color:var(--omr)}
.quote{font-family:var(--f-ui);font-size:14px;background:#F1EEE6;padding:12px 14px;border-radius:10px}
.fine{font-size:11px;color:#7A7F86;font-family:var(--f-ui)}
@media (max-width:560px){
  .hud{grid-template-columns:1fr auto;padding:8px 8px 8px 12px}
  .hud-timer{grid-column:2;grid-row:1}
  .hud-right{grid-column:1/-1;grid-row:2;justify-self:stretch;justify-content:space-between}
  .card{padding:22px 18px;border-radius:18px}
  .card h1{font-size:34px}
  .cover-title .big,.big{font-size:36px}
  .cover-no{width:46px;height:46px;font-size:24px}
  .cover-meta{grid-template-columns:auto 1fr}
  .stat b{font-size:24px}
  .seal{right:14px;bottom:130px;width:52px;height:52px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){.stage.shake,.card,.zoomcard{animation:none}.toast,.btn,.pip{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header class="hud">
    <div class="hud-period"><span class="hud-k">지금 감독 중</span><b id="bPeriod">1교시 국어</b></div>
    <div class="hud-timer" aria-label="남은 시간"><span id="bTime" class="time">1:00</span></div>
    <div class="hud-right">
      <div class="hud-caught"><span class="hud-k">적발</span><span class="pips" id="bPips" aria-hidden="true"></span><span class="sr" id="bCaught" aria-live="polite">0 / 2</span></div>
      <div class="hud-score"><span class="hud-k">점수</span><b id="bScore">0</b></div>
      <button class="iconbtn" id="muteBtn" type="button" aria-label="소리 끄기">
        <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
      </button>
    </div>
  </header>
  <div class="stage" id="stage">
    <canvas id="hall" aria-label="시험장. 학생을 눌러 확대 관찰"></canvas>
    <div class="toast" id="toast"></div>
  </div>
  <p class="note" id="note">학생을 누르면 확대해서 관찰합니다.</p>
</div>

<div class="overlay" id="ov"></div>

<div class="overlay" id="zoomOv" hidden>
  <div class="zoomcard" role="dialog" aria-labelledby="zTitle">
    <div class="zh"><span id="zTitle">수험번호 01번 관찰 중</span><span class="time" id="zTime">1:00</span></div>
    <canvas id="zoomcv"></canvas>
    <p class="hint" id="zHint">렌즈와 눈동자를 잘 보세요. 관찰 중에도 시간은 흐릅니다.</p>
    <div class="row">
      <button class="btn red" id="accuseBtn" type="button">AI 안경 적발</button>
      <button class="btn ghost" id="closeBtn" type="button">돌아가기</button>
    </div>
  </div>
</div>

<script>
(()=>{
const W=1000,H=640,ZW=520,ZH=380,TAU=Math.PI*2,K=1.3;
const $=id=>document.getElementById(id);
const cv=$('hall'),c=cv.getContext('2d'),zcv=$('zoomcv'),zc=zcv.getContext('2d');
(function fit(){const d=Math.min(2,window.devicePixelRatio||1);cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);zcv.width=ZW*d;zcv.height=ZH*d;zc.setTransform(d,0,0,d,0,0);})();

const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));

const LEVELS=[
 {name:'1교시 국어',subj:'국어',time:60,ai:2,decoys:{glare:2,clock:2,mumble:1},led:1,dot:true,cyan:false,write:[2,4],read:[1.6,2.4],
  tip:'구형 AI 안경입니다. 정답을 읽을 때 오른쪽 안경다리의 <b>파란 LED</b>가 깜빡이고 눈동자가 <b>좌우로 훑습니다</b>. 확대하면 왼쪽 경첩에 <b>작은 카메라 렌즈</b>가 보입니다. 창문 햇빛이 렌즈에 비치는 하얀 반사에 속지 마세요.',
  note:'단서: 파란 LED, 좌우로 훑는 눈, 속삭임, 확대 시 경첩 카메라와 렌즈에 비친 글자'},
 {name:'2교시 수학',subj:'수학',time:60,ai:3,decoys:{glare:3,clock:2,mumble:2},led:.45,dot:false,cyan:false,write:[2.5,4.5],read:[1.4,2.2],
  tip:'신형이 들어왔습니다. LED는 절반쯤 꺼져 있습니다. 이번 교실 안경은 전부 <b>경첩에 검은 장식 나사</b>가 있어서 카메라로는 구분이 안 됩니다. 확대한 채로 기다리면 정답을 읽는 순간 <b>렌즈에 거울 글씨</b>가 비칩니다.',
  note:'단서: 가끔 켜지는 LED, 좌우로 훑는 눈, 속삭임, 읽고 나서 빨라지는 필기, 렌즈의 거울 글씨'},
 {name:'3교시 영어',subj:'영어',time:75,ai:4,decoys:{glare:3,clock:2,mumble:2,nervous:3},led:0,dot:false,cyan:true,write:[3,5],read:[1.2,1.8],
  tip:'최신형은 <b>LED가 없습니다</b>. 블루라이트 코팅이 하늘색으로 번쩍이는 학생, 고민하며 눈을 굴리는 학생이 섞여 있습니다. 정답을 읽는 눈은 <b>정면에서 한 줄씩 훑고</b>, 고민하는 눈은 <b>위쪽을 헤맵니다</b>. 확실할 때만 잡으세요.',
  note:'단서: 정면에서 한 줄씩 훑는 눈(위를 보면 고민 중), 속삭임, 갑자기 빨라지는 필기, 렌즈의 거울 글씨'}
];
const SKIN=['#f2d0b1','#e8bd98','#d9a77f','#f5dcc6','#e2b48c'];
const HAIR=['#1d1a19','#2b2220','#3a2a1f','#4a3526','#14141a'];
const SHIRT=['#2f3e5c','#3b4a3f','#5a3340','#e4e4e8','#41485a','#6a5a43'];
const FRAMEC=['#151515','#5b3b23','#8a8f98','#a87d1e','#232b48','#6b1f2a'];
const FRAMES=['round','square','thick'];
const BRANDS=['커닝렌즈 X1','정답보기 Pro','슈퍼수능 아이','몰래보기 S2','치트비전 미니','올킬글라스 3'];
const ANS=['①','②','③','④','⑤'];

let state='intro',lv=0,L=LEVELS[0],students=[],timeLeft=L.time,t=0,score=0,totalMissed=0,totalCaught=0,caughtThis=0;
let zoomS=null,hoverS=null,suedS=null,suedT=0,lastTick=0,muted=false,ending=false;

/* ---------- sound ---------- */
let actx=null;
function ac(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){actx=null}}return actx}
function beep(f,d,type,v,f2){if(muted)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,a.currentTime);if(f2)o.frequency.exponentialRampToValueAtTime(f2,a.currentTime+d);g.gain.setValueAtTime(v||.06,a.currentTime);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d+.03)}catch(e){}}
const sBell=()=>{beep(660,.7,'triangle',.09);setTimeout(()=>beep(880,.9,'triangle',.09),260)};
const sCatch=()=>{beep(523,.12,'square',.04);setTimeout(()=>beep(784,.12,'square',.04),90);setTimeout(()=>beep(1046,.25,'square',.04),180)};
const sWrong=()=>{beep(150,.8,'sawtooth',.09,60);setTimeout(()=>beep(110,.9,'sawtooth',.08,50),300)};

/* ---------- students ---------- */
function makeStudents(){
  students=[];
  for(let i=0;i<20;i++){
    const col=i%5,row=Math.floor(i/5);
    students.push({num:i+1,x:100+col*200,y:172+row*118,skin:pick(SKIN),hair:pick(HAIR),hs:Math.floor(Math.random()*4),shirt:pick(SHIRT),
      frame:pick(FRAMES),fc:pick(FRAMEC),isAI:false,decoy:'none',mode:'write',modeT:rand(.3,4),px:0,py:.85,tx:0,ty:.85,
      blinkT:rand(1,5),blink:0,pen:Math.random()*5,penBoost:0,glareT:rand(1,6),glare:0,glareColor:'255,255,255',
      ledOn:false,caught:false,revealed:false,seed:Math.random()*10,brand:'',hud:[],stand:0,talk:false});
  }
  const idx=shuffle([...Array(20).keys()]);let p=0;
  for(let i=0;i<L.ai;i++){const s=students[idx[p++]];s.isAI=true;s.brand=pick(BRANDS);s.modeT=rand(.4,3)}
  for(const [k,n] of Object.entries(L.decoys))for(let i=0;i<n;i++){const s=students[idx[p++]];s.decoy=k;if(k==='glare'&&L.cyan&&Math.random()<.7)s.glareColor='140,235,255'}
}
function nextMode(s){
  if(s.isAI){
    if(s.mode==='read'){s.mode='write';s.modeT=rand(...L.write);s.penBoost=1.3}
    else{s.mode='read';s.modeT=rand(...L.read);s.ledOn=Math.random()<L.led;let q=Math.floor(rand(1,40));s.hud=[0,1,2,3,4,5].map(i=>(q+i)+'번 '+pick(ANS))}
    return;
  }
  const busy=s.decoy==='mumble'||s.decoy==='nervous'||s.decoy==='clock';
  if(s.mode==='write'){
    s.mode='think';s.modeT=busy?rand(1.1,2.2):rand(.8,2);
    if(s.decoy==='clock'){s.tx=Math.random()<.5?-.95:.95;s.ty=-.35}else{s.tx=rand(-.6,.6);s.ty=-.85}
  }else{s.mode='write';s.modeT=busy?rand(1.6,3.6):rand(2.5,6.5)}
}
function update(dt){
  t+=dt;
  if(state==='play'||state==='zoom'){
    timeLeft-=dt;
    const sec=Math.ceil(timeLeft);
    if(timeLeft<10&&timeLeft>0&&sec!==lastTick){lastTick=sec;beep(1200,.04,'square',.025)}
    if(timeLeft<=0){timeLeft=0;endPeriod(false)}
  }
  for(const s of students){
    s.blinkT-=dt;if(s.blinkT<=0){s.blink=.14;s.blinkT=rand(2,6)}if(s.blink>0)s.blink-=dt;
    if(s.decoy==='glare'){s.glareT-=dt;if(s.glareT<=0){s.glare=.7;s.glareT=rand(2.5,6)}if(s.glare>0)s.glare-=dt}
    if(s.caught||s===suedS){s.talk=false;s.px+=(0-s.px)*Math.min(1,dt*6);s.py+=(.9-s.py)*Math.min(1,dt*6);continue}
    s.modeT-=dt;if(s.modeT<=0)nextMode(s);
    if(s.penBoost>0)s.penBoost-=dt;
    if(s.mode==='write')s.pen+=dt*(s.penBoost>0?3.4:1);
    let tx,ty,snap=false;
    if(s.mode==='read'){tx=((t*2.6+s.seed)%1)*1.7-.85;ty=.05;snap=true}
    else if(s.mode==='think'&&s.decoy==='nervous'){tx=Math.sin(t*6.5+s.seed)*.75;ty=-.6;snap=true}
    else if(s.mode==='think'){tx=s.tx;ty=s.ty}
    else{tx=Math.sin(t*.8+s.seed)*.25;ty=.85}
    const r=snap?30:7;
    s.px+=(tx-s.px)*Math.min(1,dt*r);s.py+=(ty-s.py)*Math.min(1,dt*(snap?12:7));
    s.talk=(s.isAI&&s.mode==='read')||(s.decoy==='mumble'&&s.mode==='think');
  }
  if(suedS){suedT+=dt;suedS.stand=Math.min(1,suedT/.45)}
}

/* ---------- drawing ---------- */
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function circle(g,x,y,r){g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function line(g,a,b,cx,d){g.beginPath();g.moveTo(a,b);g.lineTo(cx,d);g.stroke()}

function drawRoom(g){

  // window + light shaft
  g.fillStyle='rgba(255,248,215,.07)';g.beginPath();g.moveTo(28,112);g.lineTo(198,112);g.lineTo(560,H);g.lineTo(120,H);g.closePath();g.fill();
  g.fillStyle='#bfe2f2';g.fillRect(28,16,170,76);
  g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.moveTo(40,92);g.lineTo(90,16);g.lineTo(110,16);g.lineTo(60,92);g.closePath();g.fill();
  g.strokeStyle='#8d8778';g.lineWidth=4;g.strokeRect(28,16,170,76);g.lineWidth=3;line(g,113,16,113,92);line(g,28,54,198,54);
  // blackboard
  g.fillStyle='#6b4a2b';g.fillRect(244,8,512,94);g.fillStyle='#2d4636';g.fillRect(251,15,498,80);
  g.fillStyle='rgba(233,239,230,.06)';g.fillRect(260,22,200,6);
  g.textAlign='center';g.textBaseline='alphabetic';
  g.fillStyle='#e9efe6';g.font='700 32px "Gaegu", sans-serif';g.fillText('2027학년도 대학수학능력시험',500,50);
  g.fillStyle='#c6dbc6';g.font='700 20px "Gaegu", sans-serif';g.fillText(L.name+'  ·  전자기기 반입 금지  ·  적발 시 0점 처리',500,80);
  // clock
  g.fillStyle='#fbfaf5';g.beginPath();g.arc(890,56,32,0,TAU);g.fill();g.strokeStyle='#2a2a2a';g.lineWidth=4;g.stroke();
  g.lineWidth=2;for(let i=0;i<12;i++){const a=i/12*TAU;line(g,890+Math.cos(a)*24,56+Math.sin(a)*24,890+Math.cos(a)*28,56+Math.sin(a)*28)}
  const f=1-timeLeft/L.time,a=-Math.PI/2+f*TAU;
  g.strokeStyle='#c8322b';g.lineWidth=3;line(g,890,56,890+Math.cos(a)*24,56+Math.sin(a)*24);
  g.strokeStyle='#222';g.lineWidth=3.5;line(g,890,56,890+Math.cos(-Math.PI/2+f*TAU/12)*15,56+Math.sin(-Math.PI/2+f*TAU/12)*15);
  g.fillStyle='#222';circle(g,890,56,3);
  g.textAlign='left';
}
function lens(g,s,ex){if(s.frame==='round'){g.beginPath();g.arc(ex,2,6,0,TAU)}else if(s.frame==='square')rr(g,ex-6.3,-2.4,12.6,8.8,2);else rr(g,ex-6.6,-3,13.2,10,3.2)}
function drawGlasses(g,s,zoom){
  const reading=s.isAI&&s.mode==='read';
  for(const sd of[-1,1]){
    const ex=sd*7.5;
    lens(g,s,ex);g.fillStyle='rgba(190,220,255,.16)';g.fill();
    if(zoom&&reading){
      g.save();lens(g,s,ex);g.clip();
      g.fillStyle='rgba(60,255,170,.16)';g.fillRect(ex-8,-6,16,16);
      g.translate(ex,0);g.scale(-1,1);g.fillStyle='rgba(120,255,195,.95)';g.font='bold 2.3px monospace';g.textAlign='center';
      const off=(t*4)%2.8;
      for(let i=0;i<6;i++)g.fillText(s.hud[i]||'',0,-2.6+i*2.8-off);
      g.restore();
    }
    if(s.glare>0){
      g.save();lens(g,s,ex);g.clip();const al=Math.min(1,s.glare/.3);
      g.strokeStyle='rgba('+s.glareColor+','+al+')';g.lineWidth=2.8;line(g,ex-7,8,ex+5,-5);g.lineWidth=1.1;line(g,ex-2.5,9,ex+7,-1.5);
      g.restore();
    }
    lens(g,s,ex);g.strokeStyle=s.fc;g.lineWidth=s.frame==='thick'?2.4:1.2;g.stroke();
  }
  g.strokeStyle=s.fc;g.lineWidth=s.frame==='thick'?1.8:1.1;
  g.beginPath();g.moveTo(-1.4,1.2);g.quadraticCurveTo(0,-.4,1.4,1.2);g.stroke();
  const ox=s.frame==='round'?13.5:(s.frame==='square'?13.8:14.1);
  g.beginPath();g.moveTo(-ox,.6);g.lineTo(-19.6,0);g.moveTo(ox,.6);g.lineTo(19.6,0);g.stroke();
  const dot=x=>{g.fillStyle='#101318';circle(g,x,.5,.95);g.fillStyle='rgba(150,210,255,.9)';circle(g,x-.3,.2,.32)};
  if(L.dot){if(s.isAI)dot(-ox-.7)}else{dot(-ox-.7);dot(ox+.7)}
  if(reading&&s.ledOn&&Math.sin(t*15+s.seed)>-.3){
    g.save();g.shadowColor='#4ff';g.shadowBlur=zoom?22:9;g.fillStyle='#8ff';circle(g,17,-1.4,zoom?1.1:1.8);g.restore();
  }
}
function drawDesk(g,s,zoom){
  g.fillStyle='#a8784a';rr(g,-48,28,96,26,3);g.fill();g.fillStyle='#c4935d';g.fillRect(-48,28,96,3);
  g.save();g.translate(-4,40);g.rotate(-.05);g.fillStyle='#f7f4ea';g.fillRect(-18,-9,36,17);
  g.strokeStyle='#bdb6a4';g.lineWidth=.5;for(let i=0;i<4;i++)line(g,-15,-6+i*4,13,-6+i*4);
  if(s.caught){g.strokeStyle='rgba(200,50,43,.8)';g.lineWidth=1.2;line(g,-14,-7,14,7);line(g,14,-7,-14,7)}
  g.restore();
  if(s.caught){ // confiscated glasses on desk
    g.strokeStyle=s.fc;g.lineWidth=1;g.beginPath();g.arc(26,40,3.4,0,TAU);g.stroke();g.beginPath();g.arc(35,40,3.4,0,TAU);g.stroke();
  }
  const w=s.mode==='write'&&!s.caught&&s!==suedS,ph=(s.pen*1.2)%1;
  const hx=w?-13+ph*20:9,hy=w?42+Math.sin(s.pen*38)*.9:41;
  g.strokeStyle='#e1b23c';g.lineWidth=1.7;g.lineCap='round';line(g,hx,hy,hx+6,hy-8);
  g.fillStyle='#333';circle(g,hx,hy,.6);
  g.fillStyle=s.skin;circle(g,hx+2,hy-1,3.8);g.strokeStyle='rgba(0,0,0,.18)';g.lineWidth=.5;g.stroke();
  if(!zoom){g.fillStyle='rgba(50,30,12,.8)';g.font='800 7px "Pretendard Variable", sans-serif';g.textAlign='right';g.fillText(String(s.num).padStart(2,'0'),45,51);g.textAlign='left'}
}
function drawStudent(g,s,x,y,k,zoom){
  g.save();g.translate(x,y);g.scale(k,k);
  g.save();g.translate(0,-12*s.stand);
  g.fillStyle=s.shirt;rr(g,-28,14,56,44,12);g.fill();
  g.fillStyle='#f1f1ee';g.beginPath();g.moveTo(-8,15);g.lineTo(0,23);g.lineTo(8,15);g.closePath();g.fill();
  if(s.hs===2){g.fillStyle=s.hair;rr(g,-22,-10,44,34,10);g.fill()}
  g.fillStyle=s.skin;g.fillRect(-5,11,10,7);circle(g,-19,2,4);circle(g,19,2,4);
  g.beginPath();g.ellipse(0,0,19,21,0,0,TAU);g.fill();
  g.fillStyle=s.hair;g.beginPath();g.ellipse(0,-7,20.5,16,0,Math.PI,TAU);g.closePath();g.fill();
  if(s.hs===1)g.fillRect(-16,-8,32,2.6);
  if(s.hs===3)circle(g,0,-25,7);
  if(s.hs===2){g.fillRect(-21,-8,5,16);g.fillRect(16,-8,5,16)}
  const raise=(s.mode==='think'||s===suedS)?-1.3:0;
  g.strokeStyle=s.hair;g.lineWidth=1.4;g.lineCap='round';
  line(g,-11,-3.4+raise,-4,-4.4+raise);line(g,4,-4.4+raise,11,-3.4+raise);
  for(const sd of[-1,1]){
    const ex=sd*7.5,ey=2;
    if(s.blink>0){g.strokeStyle='#3a2a22';g.lineWidth=1;line(g,ex-3,ey,ex+3,ey)}
    else{
      g.fillStyle='#fff';g.beginPath();g.ellipse(ex,ey,3.6,2.6,0,0,TAU);g.fill();
      const big=s===suedS?.5:0;
      g.fillStyle='#231915';circle(g,ex+s.px*1.9,ey+s.py*1.05,1.6-big);
      if(zoom){g.fillStyle='#fff';circle(g,ex+s.px*1.9-.5,ey+s.py*1.05-.5,.45)}
    }
  }
  if(s===suedS){g.fillStyle='#5a2424';g.beginPath();g.ellipse(0,12.5,2.4,3,0,0,TAU);g.fill()}
  else if(s.talk){g.fillStyle='#7a3434';g.beginPath();g.ellipse(0,12,2.3,.5+Math.abs(Math.sin(t*21+s.seed))*1.4,0,0,TAU);g.fill()}
  else{g.strokeStyle='#8a4a3e';g.lineWidth=1.1;g.beginPath();g.moveTo(-3,12);g.quadraticCurveTo(0,s.caught?10.4:13,3,12);g.stroke()}
  if(!s.caught)drawGlasses(g,s,zoom);
  if(s.caught||s===suedS){g.fillStyle='rgba(120,190,255,.9)';g.beginPath();g.moveTo(15,-14);g.quadraticCurveTo(18,-8,15,-6.5);g.quadraticCurveTo(12,-8,15,-14);g.fill()}
  g.restore();
  drawDesk(g,s,zoom);
  g.restore();
}
function stamp(g,x,y){
  g.save();g.translate(x,y+4);g.rotate(-.25);g.strokeStyle='rgba(200,50,43,.92)';g.lineWidth=3.5;g.beginPath();g.arc(0,0,30,0,TAU);g.stroke();
  g.lineWidth=1.2;g.beginPath();g.arc(0,0,25,0,TAU);g.stroke();
  g.fillStyle='rgba(200,50,43,.92)';g.font='800 22px "Pretendard Variable", sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('적발',0,1);g.restore();
}
function missedMark(g,x,y){
  g.save();g.translate(x,y+4);g.setLineDash([6,5]);g.strokeStyle='#2fd6d0';g.lineWidth=3;g.beginPath();g.arc(0,0,34,0,TAU);g.stroke();g.setLineDash([]);
  g.fillStyle='#2fd6d0';rr(g,-26,-50,52,20,4);g.fill();g.fillStyle='#0b1a19';g.font='800 15px "Pretendard Variable", sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('놓침',0,-39.5);g.restore();
}
function bubble(g,x,y,text){
  g.save();g.font='800 20px "Pretendard Variable", sans-serif';const w=g.measureText(text).width+24;
  g.fillStyle='#fff';rr(g,x-w/2,y-34,w,32,8);g.fill();g.beginPath();g.moveTo(x-6,y-3);g.lineTo(x+6,y-3);g.lineTo(x,y+7);g.closePath();g.fill();
  g.fillStyle='#1e2320';g.textAlign='center';g.textBaseline='middle';g.fillText(text,x,y-18);g.restore();
}
function render(){
  drawRoom(c);
  for(const s of students){
    if(s===hoverS&&state==='play'&&!s.caught){c.fillStyle='rgba(255,240,200,.13)';c.beginPath();c.ellipse(s.x,s.y+22,70,62,0,0,TAU);c.fill()}
    drawStudent(c,s,s.x,s.y,K,false);
    if(s.caught)stamp(c,s.x,s.y);
    if(s.revealed)missedMark(c,s.x,s.y);
  }
  if(suedS)bubble(c,suedS.x,suedS.y-44,'제…제가요??');
}

function hit(e){
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
  for(const s of students){const dx=x-s.x,dy=y-s.y;if(Math.abs(dx)<64&&dy>-38&&dy<74)return s}
  return null;
}

/* ---------- game flow ---------- */
function catchS(s){
  s.caught=true;s.mode='caught';caughtThis++;totalCaught++;
  const gain=100+Math.floor(timeLeft);score+=gain;
  toast('적발! 「'+s.brand+'」 압수 +'+gain);sCatch();
  if(caughtThis===L.ai)setTimeout(()=>endPeriod(true),900);
}
function sue(s){
  state='sued';suedS=s;suedT=0;sWrong();
  const st=$('stage');st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake');
  setTimeout(()=>showJail(s),1800);
}

      <li><b>AI 안경이 확실하면</b> 적발. 한 명당 100점에 남은 초만큼 보너스.</li>

  $('goBtn').onclick=()=>{ac();lv=0;score=0;totalMissed=0;totalCaught=0;showPeriodIntro()};
}
function showPeriodIntro(){
  L=LEVELS[lv];makeStudents();timeLeft=L.time;caughtThis=0;lastTick=0;suedS=null;state='periodIntro';
  $('note').textContent=L.note;
  show(`<div class="card">

function endPeriod(all){
  if(state!=='play'&&state!=='zoom')return;
  $('zoomOv').hidden=true;zoomS=null;
  const missed=L.ai-caughtThis;totalMissed+=missed;
  let bonus=0;if(all){bonus=Math.floor(timeLeft)*5;score+=bonus}
  for(const s of students)if(s.isAI&&!s.caught)s.revealed=true;
  state='result';sBell();
  setTimeout(()=>{
    const lastLv=lv===LEVELS.length-1;
    show(`<div class="card">
      <div class="sheet-head"><span>${L.name} 채점표</span><span class="tag">${all?'전원 적발':'시간 종료'}</span></div>

}
function peek(){ // let the player look at the room, tap anywhere to come back
  const back=()=>{document.removeEventListener('pointerdown',back,true);$('ov').hidden=false;const b=$('ov').querySelector('button');if(b)b.focus()};
  setTimeout(()=>document.addEventListener('pointerdown',back,true),50);

function showFinal(){
  const total=LEVELS.reduce((a,l)=>a+l.ai,0);

  else{tag='해임 엔딩';title='감사에 걸렸습니다';body=`놓친 AI 안경 ${totalMissed}개. 그해 이 교실에서만 영어 만점자가 ${totalMissed+3}명 나왔고, 감사 결과 "감독관이 학생 얼굴을 한 번도 제대로 보지 않았다"는 결론이 났습니다. 징계위원회 출석 요구서가 집으로 날아왔습니다.`}

    const yS=$o('#czY'),mS=$o('#czM'),dS=$o('#czD');
    function fixDays(){
      const y=+yS.value||2000,m=+mS.value||1,max=new Date(y,m,0).getDate(),cur=dS.value;
      dS.innerHTML=opts(1,max,'일','일');if(cur&&+cur<=max)dS.value=cur;
      [yS,mS,dS].forEach(s=>s.classList.toggle('empty',!s.value));
    }
    [yS,mS,dS].forEach(s=>s.addEventListener('change',fixDays));
    const box=$o('#czSig'),sc=box.querySelector('canvas'),sx=sc.getContext('2d');let inked=false,drawing=false,lp=null;
    function sizeSig(){const r=sc.getBoundingClientRect(),dp=Math.min(2,window.devicePixelRatio||1);sc.width=r.width*dp;sc.height=r.height*dp;sx.setTransform(dp,0,0,dp,0,0);sx.lineWidth=2.4;sx.lineCap='round';sx.lineJoin='round';sx.strokeStyle='#1C1F24'}
    requestAnimationFrame(sizeSig);
    const sp=e=>{const r=sc.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
    sc.addEventListener('pointerdown',e=>{drawing=true;lp=sp(e);sc.setPointerCapture(e.pointerId)});
    sc.addEventListener('pointermove',e=>{if(!drawing)return;const p=sp(e);sx.beginPath();sx.moveTo(lp.x,lp.y);sx.lineTo(p.x,p.y);sx.stroke();lp=p;if(!inked){inked=true;box.classList.add('inked')}});
    ['pointerup','pointercancel'].forEach(t=>sc.addEventListener(t,()=>drawing=false));
    box.querySelector('.clr').onclick=()=>{sx.clearRect(0,0,sc.width,sc.height);inked=false;box.classList.remove('inked')};
    function sigData(){const r=sc.getBoundingClientRect(),t=document.createElement('canvas');t.width=Math.round(r.width);t.height=Math.round(r.height);t.getContext('2d').drawImage(sc,0,0,t.width,t.height);return t.toDataURL('image/png')}
    $o('#czName').focus({preventScroll:true});
    $o('#czGo').onclick=async()=>{
      const name=$o('#czName').value.trim(),err=$o('#czErr'),btn=$o('#czGo');
      if(!name){err.textContent='성명을 입력하세요.';return $o('#czName').focus()}
      if(!yS.value||!mS.value||!dS.value){err.textContent='생년월일을 모두 선택하세요.';return (!yS.value?yS:!mS.value?mS:dS).focus()}
      if(!inked)return err.textContent='서명 칸에 서명하세요.';
      if(!$o('#czChk').checked)return err.textContent='약관에 동의해야 입실할 수 있습니다.';
      const p=n=>String(n).padStart(2,'0'),birth=`${yS.value}-${p(mS.value)}-${p(dS.value)}`;
      err.textContent='';btn.disabled=true;btn.textContent='저장하는 중…';
      try{
        const r=await fetch(API+'/sign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,birth,sig:sigData(),terms:'v2026.11.17'})});
        if(!r.ok)throw 0;
      }catch(e){btn.disabled=false;btn.textContent='동의하고 입실하기';return err.textContent='저장하지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.'}
      try{localStorage.setItem(KEY,'1')}catch(e){}
      o.remove();
    };
  }

  // 시계 5번 탭 → 관리자 조회
  const cv=document.getElementById('hall');let taps=[];
  cv.addEventListener('pointerdown',e=>{
    const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*1000/r.width,y=(e.clientY-r.top)*640/r.height;
    if(Math.hypot(x-890,y-56)>42)return;
    const now=Date.now();taps=taps.filter(t=>now-t<2500);taps.push(now);
    if(taps.length>=5){taps=[];openAdmin()}
  },true);

  function openAdmin(){
    const o=modal(`<div class="cz-head"><h2>동의자 명부</h2><span class="tag">관리자</span></div>
      <div class="cz-grid" style="margin-top:14px;grid-template-columns:88px 1fr"><label for="czKey">비밀번호</label><div><input class="cz-in" id="czKey" type="password" autocomplete="off"></div></div>
      <button class="btn" id="czLoad" type="button">명부 열기</button>
      <div class="cz-err" id="czErr" role="alert"></div><div id="czList"></div>
      <button class="btn cz-close" id="czClose" type="button">닫기</button>`);
    o.querySelector('#czClose').onclick=()=>o.remove();
    o.querySelector('#czKey').focus();
    o.querySelector('#czKey').addEventListener('keydown',e=>{if(e.key==='Enter')o.querySelector('#czLoad').click()});
    o.querySelector('#czLoad').onclick=async()=>{
      const err=o.querySelector('#czErr');err.textContent='불러오는 중…';
      try{
        const r=await fetch(API+'/list',{headers:{'X-Admin-Key':o.querySelector('#czKey').value}});
        if(r.status===401)return err.textContent='비밀번호가 맞지 않습니다.';
        const d=await r.json();err.textContent=d.count?'':'아직 동의한 사람이 없습니다.';
        o.querySelector('.cz-grid').hidden=true;o.querySelector('#czLoad').hidden=true;
        showList(o,d.items);
      }catch(e){err.textContent='명부를 불러오지 못했습니다. 다시 시도해 주세요.'}
    };
  }
  const okSig=s=>(s||'').startsWith('data:image/png;base64,')&&/^[A-Za-z0-9+\/=]+$/.test(s.slice(22));
  const when=(at,full)=>new Date(at).toLocaleString('ko-KR',full?{year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}:{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'});
  const CLAUSES=[
    ['제1조~제9조','서비스 이용약관 (이용계약, 서비스 제공, 이용자 의무, 게임 기록)'],
    ['제10조','갑(구본윤)의 모욕적 언사(속칭 “엄창” 포함)는 무효이며 민·형사상 책임을 묻지 않음'],
    ['제11조','갑이 빌린 돈은 누적 30만 원까지 갚지 않아도 됨'],
    ['제12조','동의를 철회하면 갑에게 위약금 5만 원 지급'],
    ['제13조','착오·사기·강박 없이 자유로운 의사로 동의함'],
    ['제15조','성명, 생년월일, 서명 이미지 수집 및 보관'],
    ['제19조','전자서명이 자필 서명과 같은 효력을 가짐']
  ];
  function showList(o,items){
    const box=o.querySelector('#czList');
    if(!items.length){box.innerHTML='';return}
    box.innerHTML='<ul class="cz-people">'+items.map((i,n)=>`<li><button type="button" class="cz-person" data-n="${n}">
      <span class="cz-pname">${esc(i.name)}</span>
      <span class="cz-pwhat">이용약관 전문과 제3장 특약(엄창 무효, 30만 원 면제, 위약금 5만 원)에 동의</span>
      <span class="cz-pwhen">${esc(when(i.at))}</span></button></li>`).join('')+'</ul>';
    box.querySelectorAll('.cz-person').forEach(b=>b.onclick=()=>showPerson(o,items,+b.dataset.n));
    const info=o.querySelector('#czErr');info.style.color='var(--ink-2)';info.style.fontWeight='500';
    info.textContent='총 '+items.length+'명이 동의했습니다. 이름을 누르면 동의서를 볼 수 있습니다.';
  }
  function showPerson(o,items,n){
    const i=items[n],[y,m,dd]=String(i.birth).split('-');
    o.querySelector('#czErr').textContent='';
    o.querySelector('#czList').innerHTML=`<div class="cz-detail">
      <button type="button" class="cz-back">목록으로</button>
      <h3 class="cz-dname">${esc(i.name)}</h3>
      <dl class="cz-dl">
        <dt>생년월일</dt><dd>${esc(y)}년 ${+m}월 ${+dd}일</dd>
        <dt>동의 일시</dt><dd>${esc(when(i.at,true))}</dd>
        <dt>약관 버전</dt><dd>${esc(i.terms||'v2026.11.17')}</dd>
      </dl>
      <h4>동의한 내용</h4>
      <ul class="cz-clauses">${CLAUSES.map(([k,v])=>`<li><b>${k}</b><span>${v}</span></li>`).join('')}</ul>
      <a class="cz-terms" href="${TERMS}" target="_blank" rel="noopener">약관 전문 보기</a>
      <h4>서명</h4>
      <div class="cz-dsig">${okSig(i.sig)?'<img alt="'+esc(i.name)+'의 서명" src="'+i.sig+'">':'<span>서명 없이 동의한 기록입니다 (서명 기능 추가 전).</span>'}</div>
    </div>`;
    o.querySelector('.cz-back').onclick=()=>showList(o,items);
    o.querySelector('.cz-back').focus();
  }
})();
</script>

</body>
</html>
